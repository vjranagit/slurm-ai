<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adaptive WLM Controller</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root {
        --bg: #081022;
        --panel: #111c36;
        --line: #2d3f69;
        --text: #e6ecff;
        --muted: #9fb2de;
        --good: #29d391;
        --warn: #f4c95d;
        --bad: #ff6b6b;
      }
      body {
        margin: 0;
        background: radial-gradient(circle at 10% 10%, #172b5a, var(--bg));
        color: var(--text);
        font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      }
      .wrap {
        max-width: 1100px;
        margin: 24px auto;
        padding: 0 16px;
      }
      .grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }
      .card {
        background: linear-gradient(180deg, #17274e, var(--panel));
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
      }
      .k {
        font-size: 12px;
        color: var(--muted);
      }
      .v {
        font-size: 28px;
        font-weight: 700;
        margin-top: 6px;
      }
      .status {
        display: inline-block;
        margin-top: 8px;
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 12px;
      }
      .good { background: #124b37; color: #9ff5cf; }
      .warn { background: #5a4a12; color: #ffe9a8; }
      .bad { background: #571f1f; color: #ffc3c3; }
      pre {
        background: #0b1428;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Adaptive WLM Controller</h1>
      <p>Live Slurm pressure and queue signals.</p>
      <div class="grid" id="cards"></div>
      <h3>Raw Snapshot</h3>
      <pre id="raw">loading...</pre>
    </div>

    <script>
      function label(v) {
        if (v >= 0.85) return ["high", "bad"];
        if (v <= 0.45) return ["low", "good"];
        return ["moderate", "warn"];
      }

      async function tick() {
        const r = await fetch("/cluster/snapshot");
        const d = await r.json();
        const [txt, cls] = label(d.cpu_pressure);
        const cards = [
          ["Pending Jobs", d.pending_jobs],
          ["Running Jobs", d.running_jobs],
          ["Idle Nodes", d.idle_nodes + " / " + d.total_nodes],
          ["CPU Pressure", d.cpu_pressure.toFixed(3)],
          ["Mem Pressure", d.mem_pressure.toFixed(3)],
          ["IO Pressure", d.io_pressure.toFixed(3)],
          ["Completed 5m", d.completed_jobs_5m]
        ];
        document.getElementById("cards").innerHTML = cards
          .map(
            ([k, v]) => `
          <div class="card">
            <div class="k">${k}</div>
            <div class="v">${v}</div>
            ${k === "CPU Pressure" ? `<span class="status ${cls}">${txt}</span>` : ""}
          </div>`
          )
          .join("");
        document.getElementById("raw").textContent = JSON.stringify(d, null, 2);
      }

      tick();
      setInterval(tick, 5000);
    </script>
  </body>
</html>
