services:
  slurm:
    build:
      context: ../../
      dockerfile: infra/docker/slurm/Dockerfile
    container_name: slurm-local
    hostname: slurm
    # sandbox-only: needed for cgroup/systemd in the single-container Slurm sandbox;
    # NEVER use against a real cluster
    privileged: true
    command: []
    ports:
      - "127.0.0.1:6817:6817"
      - "127.0.0.1:6818:6818"
    volumes:
      - slurm-spool:/var/spool
      - slurm-logs:/var/log/slurm

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: adaptive-prometheus
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.2.2
    container_name: adaptive-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

volumes:
  slurm-spool:
  slurm-logs:
