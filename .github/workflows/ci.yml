name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install
        run: |
          # Upgrade setuptools alongside pip: the setup-python-provided version can be
          # old enough to carry known CVEs (PYSEC-2025-49, PYSEC-2026-1918) that would
          # otherwise show up as noise in the dependency audit step below.
          python -m pip install --upgrade pip setuptools
          pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Audit dependencies
        run: pip-audit
