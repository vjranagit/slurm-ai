# Automated dependency update PRs. Complements the CI `pip-audit` gate added in
# harden/next-items: pip-audit FAILS the build when a known-vulnerable version is
# installed; Dependabot PROPOSES the bump (e.g. the starlette>=1.3.1 CVE floor,
# PYSEC-2026-248/249, was found and fixed manually — this automates the next one).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
