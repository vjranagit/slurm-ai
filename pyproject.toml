[project]
name = "adaptive-wlm-controller"
version = "0.1.0"
description = "Adaptive quota-aware workload manager controller for Slurm"
license = { text = "MIT" }
authors = [{ name = "vjranagit" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "prometheus-client>=0.22.0",
  "pydantic>=2.11.0",
  "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.9.0",
  # Required by fastapi/starlette TestClient (controller/tests/test_api.py). Not pulled in
  # transitively, so a fresh CI install lacks it and test collection hard-fails; pin it here.
  # httpx (not httpx2) keeps test_bugfixes.py's importorskip("httpx") test active (full 182).
  "httpx>=0.28,<1.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["controller*", "apps*"]
